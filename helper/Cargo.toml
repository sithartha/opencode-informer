[package]
name = "opencode-informer-helper"
version = "0.2.0"
edition = "2021"
description = "Cross-platform companion helper for OpenCode Informer: BLE doorbell peripheral, rendezvous, and pairing approval for macOS, Linux, and Windows."
license = "MIT"
repository = "https://github.com/sithartha/opencode-informer"

[[bin]]
name = "opencode-informer-helper"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
ureq = { version = "2", default-features = false, features = ["json"] }
if-addrs = "0.15"
uuid = "1"
futures = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17", features = ["bluetoothd"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Devices_Bluetooth",
  "Devices_Bluetooth_Advertisement",
  "Devices_Bluetooth_GenericAttributeProfile",
  "Storage_Streams",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
